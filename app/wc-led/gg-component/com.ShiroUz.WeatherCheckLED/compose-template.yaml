services:
  weather-check:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-1.amazonaws.com/aws-gg-handson/wc-led:${IMAGE_TAG}
    restart: "no"
    privileged: true  # GPIO制御に必要な権限
    devices:
      - /dev/gpiomem:/dev/gpiomem  # GPIOメモリへのアクセス
      - /dev/mem:/dev/mem  # メモリへの直接アクセス
    volumes:
      - /sys:/sys  # sysfsへのアクセス
      - $AWS_GG_NUCLEUS_DOMAIN_SOCKET_FILEPATH_FOR_COMPONENT:$AWS_GG_NUCLEUS_DOMAIN_SOCKET_FILEPATH_FOR_COMPONENT # IPC通信のためのドメインソケット(hostを介してIoT Coreとの通信)
    environment:
      - PYTHONUNBUFFERED=1  # Pythonの出力バッファリングを無効化
      - AWS_CONTAINER_CREDENTIALS_FULL_URI # Token Exchange Serviceからの認証情報URI
      - AWS_CONTAINER_AUTHORIZATION_TOKEN # Token Exchange Serviceからの認証トークン
      - AWS_GG_NUCLEUS_DOMAIN_SOCKET_FILEPATH_FOR_COMPONENT # Greengrass Nucleusのドメインソケットパス
      - SVCUID # コンポーネントが IPC ソケットに接続し、 AWS IoT Greengrass Core ソフトウェアと通信するために使用するシークレットトークン。
      - AWS_IOT_THING_NAME # Greengrass Core デバイスの Thing 名
      - AWS_REGION  # AWSリージョン
      - BUCKET_NAME=${ENVIRONMENT}-aws-gg-handson-wc-led-tts-${AWS_ACCOUNT_ID} # 天気情報画像保存用S3バケット
    network_mode: "host"  # ホストネットワークを使用
