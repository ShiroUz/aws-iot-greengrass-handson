name: "Release GG Docker Component"
on:
  # https://zenn.dev/hankei6km/articles/use-github-acions-workflow-dispatch-inputs-safely
  workflow_dispatch:
    inputs:
      branch:
        type: string
        required: true
        description: 'DockerのComponentをReleaseするBranch名'
      ApplicationName:
        type: choice
        required: true
        description: 'ReleaseするApplication名'
        options:
          - wc-led
          - ai-dp
      publish-component-name:
        type: choice
        required: true
        description: 'ReleaseするCustom Component名'
        options:
          - com.ShiroUz.WeatherCheckLED
          - com.ShiroUz.AIDrivingPartner
      component-version:
        type: string
        required: true
        description: 'ReleaseするCustom Componentのバージョン'
        default: '1.0.0'
      env:
        type: choice
        required: true
        description: '環境名を記載(dev/stg/prod):certの取得で使用'
        options:
          - dev
          - stg
          - prod

env:
  AWS_DEFAULT_REGION: "ap-northeast-1"
  AWS_ROLE_ARN: ${{ secrets.GG_COMPONENT_RELEASE_ROLE_ARN }}
  BRANCH: ${{ github.event.inputs.branch }}
  ENVIRONMENT: ${{ github.event.inputs.env }}
  BUILD_TARGET_DIRECTORY: "./app/${{github.event.inputs.ApplicationName}}/gg-component/${{ github.event.inputs.publish-component-name }}"
  PUBLISHED_S3_BUCKET: "${{ github.event.inputs.env }}-aws-gg-handson-gg-components"
  PUBLISH_COMPONENT_NAME: ${{ github.event.inputs.publish-component-name }}
  COMPONENT_VERSION: ${{ github.event.inputs.component-version }}

jobs:
  release:
    name: Component release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        ref: ${{env.BRANCH}}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
      with:
        role-to-assume: ${{ env.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_DEFAULT_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      
    - name: Set up QEMU
      uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      
    - name: Docker Build and Publish
      id: build_publish
      working-directory: ${{ env.BUILD_TARGET_DIRECTORY }}
      run: |
        echo "Publishing container image ..."
        
        set -xe
        CONFIG_JSON=`cat ../../../../.github/workflows/config/image-config.json`
        ECR_REGION=ap-northeast-1
        AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
        ECR_HOST=${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-1.amazonaws.com
        IMAGE_TAG="v${{ env.COMPONENT_VERSION }}"
        PUSH_REPOSITORY=`echo ${CONFIG_JSON} | jq -r ".[\"${{ env.PUBLISH_COMPONENT_NAME }}\"]"`

        echo "PUSH_REPOSITORY: ${PUSH_REPOSITORY}"
        # Use buildx for multi-architecture builds with increased timeout
        docker buildx build --platform=linux/arm/v7 \
          --tag ${ECR_HOST}/${PUSH_REPOSITORY}:${IMAGE_TAG} \
          --push \
          --progress=plain \
          --build-arg BUILDKIT_STEP_TIMEOUT=3600 \
          --build-arg AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID} \
          .
        
        # Generate compose.yaml from template
        sed "s|\${AWS_ACCOUNT_ID}|${AWS_ACCOUNT_ID}|g; s|\${IMAGE_TAG}|${IMAGE_TAG}|g; s|\${ENVIRONMENT}|${{ env.ENVIRONMENT }}|g" compose-template.yaml > compose.yaml
        
        # Generate recipe.yaml from template
        sed "s|\${COMPONENT_VERSION}|${{ env.COMPONENT_VERSION }}|g; s|\${PUBLISHED_S3_BUCKET}|${{ env.PUBLISHED_S3_BUCKET }}|g; s|\${ENVIRONMENT}|${{ env.ENVIRONMENT }}|g; s|\${AWS_ACCOUNT_ID}|${AWS_ACCOUNT_ID}|g; s|\${PUBLISH_COMPONENT_NAME}|${{ env.PUBLISH_COMPONENT_NAME }}|g; s|\${IMAGE_TAG}|${IMAGE_TAG}|g; s|\${ECR_HOST}|${ECR_HOST}|g; s|\${PUSH_REPOSITORY}|${PUSH_REPOSITORY}|g" recipe-template.yaml > recipe.yaml

        # Publish compose.yaml
        aws s3 cp ./compose.yaml s3://${{ env.PUBLISHED_S3_BUCKET }}-${AWS_ACCOUNT_ID}/${{ env.PUBLISH_COMPONENT_NAME }}/${IMAGE_TAG}/compose.yaml
        
        echo "Publishing recipe ..."
        aws greengrassv2 create-component-version --inline-recipe fileb://recipe.yaml --region ${{ env.AWS_DEFAULT_REGION }}

        # aws greengrassv2 describe-component --arn arn:aws:greengrass:${{ env.AWS_DEFAULT_REGION }}:${AWS_ACCOUNT_ID}:components/${{ github.event.inputs.publish-component-name }}/versions:${{github.event.inputs.component-version}} --region ${{ env.AWS_DEFAULT_REGION }} > component.json
      